<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="site-header">
  <a
    class="brand"
    [routerLink]="autenticacion.usuarioActual ? '/publicaciones' : '/login'"
    aria-label="floppy, inicio"
    >floppy<span class="brand-paw"
      ><svg viewBox="0 0 32 32" aria-hidden="true" fill="currentColor">
        <ellipse cx="8" cy="11" rx="3.1" ry="4.2" transform="rotate(-25 8 11)" />
        <ellipse cx="14" cy="7" rx="3" ry="4" transform="rotate(-8 14 7)" />
        <ellipse cx="21" cy="8" rx="3" ry="4" transform="rotate(15 21 8)" />
        <ellipse cx="26" cy="14" rx="2.8" ry="3.8" transform="rotate(32 26 14)" />
        <path d="M8 23c-1-3 3-5 5-8 2-2 5-2 7 1 2 3 5 4 4 7-1 4-5 2-8 2-3 0-7 3-8-2Z" /></svg></span
  ></a>
  <nav aria-label="Navegación principal">
    <a
      *appSoloUsuarios="autenticacion.usuarioActual"
      routerLink="/publicaciones"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      >La manada
      <span aria-hidden="true"
        ><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use href="icons.svg#arrow-up-right"></use></svg></span
    ></a>
    <a
      *appSoloUsuarios="autenticacion.usuarioActual"
      routerLink="/mi-perfil"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      >Mi perfil</a
    >
    <a
      *appSoloInvitados="autenticacion.usuarioActual"
      class="nav-login"
      routerLink="/login"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      >Entrar
      <span aria-hidden="true"
        ><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use href="icons.svg#arrow-up-right"></use></svg></span
    ></a>
    <a
      *appSoloInvitados="autenticacion.usuarioActual"
      class="nav-register"
      routerLink="/registro"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      >Sumate
      <span aria-hidden="true"
        ><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use href="icons.svg#plus"></use></svg></span
    ></a>
  </nav>
</header>
<main id="contenido" tabindex="-1"><router-outlet /></main>
@if (reloj.avisoPendiente | async) {
  <app-aviso-sesion />
}
<footer class="site-footer">
  <a [routerLink]="autenticacion.usuarioActual ? '/publicaciones' : '/login'" class="footer-brand"
    >floppy</a
  ><span>La vida, con mascotas.</span>
</footer>
