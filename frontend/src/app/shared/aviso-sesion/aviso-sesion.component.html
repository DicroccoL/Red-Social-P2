<dialog
  #dialogo
  (cancel)="posponer($event)"
  aria-labelledby="titulo-sesion"
  aria-describedby="descripcion-sesion"
>
  <h2 id="titulo-sesion">Tu sesión está por terminar</h2>
  <p id="descripcion-sesion">¿Querés extender tu sesión?</p>
  <div class="tiempo-restante">
    <span id="etiqueta-tiempo">Tiempo restante</span>
    <strong role="timer" aria-labelledby="etiqueta-tiempo">{{ tiempoRestante | async }}</strong>
  </div>
  @if (error) {
    <p role="alert">{{ error }}</p>
  }
  <div class="botones">
    <button
      class="button button-outline"
      type="button"
      [disabled]="renovando"
      (click)="posponer()"
    >
      Ahora no
    </button>
    <button
      class="button button-primary"
      type="button"
      [disabled]="renovando"
      (click)="extender()"
    >
      {{ renovando ? 'Extendiendo…' : 'Extender sesión' }}
    </button>
  </div>
</dialog>
