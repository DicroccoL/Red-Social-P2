<div
  class="fecha-control"
  role="group"
  [attr.aria-label]="etiqueta"
  [class.invalida]="invalid"
  [class.deshabilitado]="deshabilitado"
>
  <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
    <use href="icons.svg#calendar"></use>
  </svg>
  <input
    [id]="inputId"
    type="text"
    inputmode="numeric"
    maxlength="2"
    placeholder="DD"
    aria-label="Día"
    [attr.autocomplete]="nacimiento ? 'bday-day' : 'off'"
    [value]="dia"
    [disabled]="deshabilitado"
    [attr.aria-invalid]="invalid"
    [attr.aria-describedby]="describedBy || null"
    (input)="escribir('dia', $event)"
    (focus)="$any($event.target).select()"
    (blur)="completar('dia')"
  />
  <span aria-hidden="true">/</span>
  <input
    type="text"
    inputmode="numeric"
    maxlength="2"
    placeholder="MM"
    aria-label="Mes"
    [attr.autocomplete]="nacimiento ? 'bday-month' : 'off'"
    [value]="mes"
    [disabled]="deshabilitado"
    [attr.aria-invalid]="invalid"
    [attr.aria-describedby]="describedBy || null"
    (input)="escribir('mes', $event)"
    (focus)="$any($event.target).select()"
    (blur)="completar('mes')"
  />
  <span aria-hidden="true">/</span>
  <input
    class="anio"
    type="text"
    inputmode="numeric"
    maxlength="4"
    placeholder="AAAA"
    aria-label="Año"
    [attr.autocomplete]="nacimiento ? 'bday-year' : 'off'"
    [value]="anio"
    [disabled]="deshabilitado"
    [attr.aria-invalid]="invalid"
    [attr.aria-describedby]="describedBy || null"
    (input)="escribir('anio', $event)"
    (focus)="$any($event.target).select()"
    (blur)="completar('anio')"
  />
</div>
