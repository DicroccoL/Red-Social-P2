<article class="pet-post" aria-label="Publicación de demostración de Milo">
  <header class="post-header">
    <img src="images/milo-avatar.webp" alt="" width="38" height="38" />
    <div class="post-author"><strong>Milo</strong><span>De paseo</span></div>
    <span class="demo-label">Ejemplo</span>
  </header>
  <img
    class="post-photo"
    src="images/milo-paseo.webp"
    alt="Milo, un golden retriever, paseando con una hoja en la boca"
    width="1000"
    height="667"
    [attr.loading]="compact ? 'eager' : 'lazy'"
  />
  <div class="post-content">
    <p>El tesoro del paseo.</p>
    @if (compact) {
      <a class="post-peek" routerLink="/publicaciones"
        >Ver la manada
        <span aria-hidden="true"
          ><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <use href="icons.svg#arrow-up-right"></use></svg></span
      ></a>
    } @else {
      <div class="post-actions">
        <button
          class="boton-me-gusta"
          type="button"
          (click)="liked = !liked"
          [class.marcado]="liked"
          [attr.aria-pressed]="liked"
          [attr.aria-label]="liked ? 'Quitar me gusta de ejemplo' : 'Me gusta de ejemplo'"
          [title]="liked ? 'Quitar me gusta' : 'Me gusta'"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"
            />
          </svg></button
        ><button
          type="button"
          (click)="showComment = !showComment"
          [attr.aria-expanded]="showComment"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 1 1 18 0Z" /></svg
          >Comentar
        </button>
      </div>
      @if (showComment) {
        <form class="demo-comment" (submit)="addComment($event, commentInput)">
          <label class="visually-hidden" for="demo-comment">Comentario de prueba</label
          ><input
            #commentInput
            id="demo-comment"
            placeholder="Un comentario de prueba…"
            maxlength="180"
            required
            autocomplete="off"
          /><button type="submit" aria-label="Agregar comentario de prueba">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <use href="icons.svg#arrow-up-right"></use>
            </svg>
          </button>
        </form>
      }
      @if (comment) {
        <p class="sample-comment" role="status">
          <strong>Tu comentario de prueba</strong>{{ comment }}
        </p>
      }
    }
  </div>
</article>
