<section class="auth-layout register-layout" aria-labelledby="page-title">
  <div class="auth-story">
    <p class="eyebrow">LA RED DE LAS MASCOTAS</p>
    <h1 id="page-title">Hola,<br /><em>manada.</em></h1>
    <p class="intro">Un lugar para vos y tu mascota.</p>
    <img class="pet-art" src="pets-doodle.svg" alt="" width="360" height="180" aria-hidden="true" />
  </div>
  <div class="auth-card-wrap">
    <div class="auth-card">
      <h2>Sumate a floppy.</h2>
      <form (submit)="onSubmit($event)">
        <label for="register-name">¿Cómo te llamás?</label
        ><input
          id="register-name"
          name="name"
          autocomplete="name"
          placeholder="Tu nombre"
          required
          maxlength="80"
        /><label for="register-email">Tu email</label
        ><input
          id="register-email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="vos@ejemplo.com"
          required
        /><label for="register-password">Elegí una contraseña</label>
        <div class="password-field">
          <input
            id="register-password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="new-password"
            placeholder="Al menos 8 caracteres"
            minlength="8"
            required
            aria-describedby="password-hint"
          /><button
            class="password-toggle"
            type="button"
            (click)="showPassword = !showPassword"
            [attr.aria-pressed]="showPassword"
            aria-controls="register-password"
          >
            {{ showPassword ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
        <p id="password-hint" class="field-hint">Usá al menos 8 caracteres.</p>
        <button class="button button-primary" type="submit">
          Crear cuenta <span aria-hidden="true">↗</span>
        </button>
        @if (submitted) {
          <p class="form-notice" role="status">
            El registro todavía no está disponible. Podés
            <a routerLink="/publicaciones">conocer la comunidad</a>.
          </p>
        }
      </form>
      <div class="card-bottom">
        <span>¿Ya tenés cuenta?</span><a routerLink="/login">Entrá ↗</a>
      </div>
    </div>
  </div>
</section>
