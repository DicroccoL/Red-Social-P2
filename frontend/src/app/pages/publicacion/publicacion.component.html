<section class="detalle-publicacion">
  <a class="volver" routerLink="/publicaciones"
    ><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <use href="icons.svg#arrow-left"></use>
    </svg>
    Volver a la manada</a
  >
  @if (cargando) {
    <p role="status">Cargando publicación…</p>
  }
  @if (error) {
    <p role="alert">{{ error }}</p>
  }
  @if (publicacion; as actual) {
    <div class="detalle-contenido">
      <app-publicacion
        [publicacion]="actual"
        [cantidadComentariosDetalle]="conversacion.total"
        [procesando]="procesando"
        [mostrarEnlace]="false"
        [mostrarComentarios]="false"
        (cambiarMeGusta)="cambiarMeGusta()"
        (eliminar)="confirmarEliminacion = true"
      />
      <app-comentarios
        #conversacion
        [publicacionId]="actual._id"
        [totalInicial]="actual.cantidadComentarios"
      />
    </div>
  }
</section>
@if (confirmarEliminacion) {
  <app-confirmar-accion (confirmado)="eliminar()" (cancelado)="confirmarEliminacion = false" />
}
