<section class="auth-layout pets-auth" aria-labelledby="page-title">
  <div class="auth-story">
    <h1 id="page-title">La red social<br />de tu <em>mascota.</em></h1>
    <p class="intro">Sus fotos. Sus amigos. Sus mejores momentos.</p>
    <div class="pet-scene">
      <span class="pet-tag"
        ><svg viewBox="0 0 32 32" aria-hidden="true" fill="currentColor">
          <ellipse cx="8" cy="11" rx="3.1" ry="4.2" transform="rotate(-25 8 11)" />
          <ellipse cx="14" cy="7" rx="3" ry="4" transform="rotate(-8 14 7)" />
          <ellipse cx="21" cy="8" rx="3" ry="4" transform="rotate(15 21 8)" />
          <ellipse cx="26" cy="14" rx="2.8" ry="3.8" transform="rotate(32 26 14)" />
          <path d="M8 23c-1-3 3-5 5-8 2-2 5-2 7 1 2 3 5 4 4 7-1 4-5 2-8 2-3 0-7 3-8-2Z" /></svg
        ><span>La vida, con ellos.</span></span
      ><img
        class="pets-photo"
        src="images/pets-hero.webp"
        alt="Un perro golden y un gato juntos"
        width="1000"
        height="667"
        fetchpriority="high"
      />
      <div class="hero-post"><app-pet-post-preview [compact]="true" /></div>
    </div>
  </div>
  <div class="auth-card-wrap">
    <div class="auth-card">
      <h2>Hola de nuevo.</h2>
      <form
        [formGroup]="formulario"
        (ngSubmit)="iniciarSesion()"
        novalidate
        [attr.aria-busy]="enviando"
      >
        <fieldset class="auth-fields" [disabled]="enviando">
          <legend class="visually-hidden">Datos de acceso</legend>
          <label for="login-email">Tu email</label
          ><input
            id="login-email"
            formControlName="correo"
            type="email"
            autocomplete="email"
            placeholder="vos@ejemplo.com"
            maxlength="254"
            [attr.aria-invalid]="!!errorCampo('correo')"
            aria-describedby="login-error-correo"
          />
          @if (errorCampo('correo')) {
            <p class="field-error" id="login-error-correo">{{ errorCampo('correo') }}</p>
          }
          <label for="login-password">Tu contraseña</label>
          <div class="password-field">
            <input
              id="login-password"
              formControlName="contrasena"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="La de siempre"
              maxlength="64"
              [attr.aria-invalid]="!!errorCampo('contrasena')"
              aria-describedby="login-error-contrasena"
            /><button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-pressed]="showPassword"
              aria-controls="login-password"
            >
              {{ showPassword ? 'Ocultar' : 'Ver' }}
            </button>
          </div>
          @if (errorCampo('contrasena')) {
            <p class="field-error" id="login-error-contrasena">{{ errorCampo('contrasena') }}</p>
          }
        </fieldset>
        <button class="button button-primary" type="submit" [disabled]="enviando">
          {{ enviando ? 'Ingresando…' : 'Entrar' }}
          <span aria-hidden="true"
            ><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <use href="icons.svg#arrow-up-right"></use></svg
          ></span>
        </button>
      </form>
      <div class="card-bottom">
        <span>¿Sin cuenta?</span
        ><a routerLink="/registro"
          >Sumate
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <use href="icons.svg#arrow-up-right"></use></svg
        ></a>
      </div>
    </div>
  </div>
</section>
@if (aviso) {
  <app-aviso-modal titulo="No pudimos iniciar sesión" [mensaje]="aviso" (cerrado)="aviso = null" />
}
